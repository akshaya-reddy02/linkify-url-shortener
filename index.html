<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Linkify - URL Shortener</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .logo {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 38px;
            color: #222;
            margin-bottom: 10px;
        }

        .highlight {
            color: #667eea;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        #urlInput {
            flex: 1;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #urlInput:focus {
            border-color: #667eea;
        }

        #shortenButton {
            padding: 16px 22px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #shortenButton:hover {
            background: #5568d8;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f5f7ff;
            border-radius: 12px;
        }

        .result-title {
            color: #555;
            margin-bottom: 10px;
        }

        #shortUrl {
            color: #667eea;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            word-break: break-all;
        }

        #shortUrl:hover {
            text-decoration: underline;
        }

        #copyButton {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        #copyButton:hover {
            background: #444;
        }

        #error {
            color: #e63946;
            margin-top: 15px;
            font-size: 14px;
        }

        .click-stats {
            margin-top: 18px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            color: #555;
            font-size: 16px;
        }

        .click-number {
            color: #667eea;
            font-size: 22px;
            font-weight: bold;
        }

        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }

        .feature {
            color: #555;
            font-size: 14px;
        }

        .feature-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }

            .input-group {
                flex-direction: column;
            }

            #shortenButton {
                width: 100%;
            }

            .features {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🔗</div>

        <h1>
            Link<span class="highlight">ify</span>
        </h1>

        <p class="subtitle">
            Shorten your links. Share them anywhere.
        </p>

        <div class="input-group">

            <input
                type="text"
                id="urlInput"
                placeholder="Paste your long URL here..."
            >

            <button id="shortenButton" onclick="shortenUrl()">
                Shorten URL
            </button>

        </div>

        <div id="error"></div>

        <div id="result">

            <p class="result-title">
                Your shortened URL
            </p>

            <a
                id="shortUrl"
                href="#"
                target="_blank">
            </a>

            <br>

            <button id="copyButton" onclick="copyUrl()">
                📋 Copy URL
            </button>

            <div class="click-stats">
                📊 Clicks:
                <span id="clickCount" class="click-number">0</span>
            </div>

        </div>

        <div class="features">

            <div class="feature">
                <span class="feature-icon">⚡</span>
                Fast
            </div>

            <div class="feature">
                <span class="feature-icon">🔒</span>
                Simple
            </div>

            <div class="feature">
                <span class="feature-icon">📊</span>
                Track Clicks
            </div>

        </div>

    </div>

    <script>

        let currentShortCode = "";

        async function shortenUrl() {

            const urlInput = document.getElementById("urlInput");
            const result = document.getElementById("result");
            const shortUrl = document.getElementById("shortUrl");
            const clickCount = document.getElementById("clickCount");
            const error = document.getElementById("error");

            const originalUrl = urlInput.value.trim();

            error.textContent = "";
            result.style.display = "none";

            if (!originalUrl) {
                error.textContent = "Please enter a URL.";
                return;
            }

            try {

                const url = new URL(originalUrl);

                if (
                    url.protocol !== "http:" &&
                    url.protocol !== "https:"
                ) {
                    throw new Error("Invalid protocol");
                }

            } catch {

                error.textContent =
                    "Please enter a valid URL, like https://example.com";

                return;
            }

            try {

                const response = await fetch("/shorten", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        originalUrl: originalUrl
                    })

                });

                const data = await response.json();

                if (!response.ok) {

                    error.textContent =
                        data.error || "Something went wrong.";

                    return;
                }

                shortUrl.textContent = data.shortUrl;
                shortUrl.href = data.shortUrl;

                clickCount.textContent = data.data.clicks;

                // Get the short code
                currentShortCode =
                    data.shortUrl.split("/").pop();

                result.style.display = "block";

            } catch (err) {

                error.textContent =
                    "Unable to connect to the server.";

            }
        }

        async function updateClickCount() {

            if (!currentShortCode) {
                return;
            }

            try {

                const response =
                    await fetch(`/stats/${currentShortCode}`);

                const data = await response.json();

                if (response.ok) {

                    document.getElementById("clickCount")
                        .textContent = data.clicks;

                }

            } catch (error) {

                console.log("Unable to update click count.");

            }
        }

        function copyUrl() {

            const shortUrl =
                document.getElementById("shortUrl").textContent;

            navigator.clipboard.writeText(shortUrl);

            alert("Short URL copied!");

        }

        // Check click count every 2 seconds
        setInterval(updateClickCount, 2000);

    </script>

</body>
</html>
